<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Owner Review Dashboard — Phase 7.4 (Offline)</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <div id="offline-banner" role="alert">
    <strong>OFFLINE REVIEW MODE</strong>
    <span>No Amazon connection. No Amazon action has been performed. All decisions require manual owner review.</span>
  </div>

  <header id="statusbar">
    <div class="status-left">
      <span class="app-title">Owner Review Dashboard</span>
      <span class="app-sub">Phase 7.4 · read-only · local</span>
    </div>
    <div class="status-right" id="status-metrics" aria-live="polite"></div>
  </header>

  <div id="shell">
    <nav id="sidebar" aria-label="Views">
      <ul id="nav-list"></ul>
    </nav>

    <main id="content" tabindex="-1">
      <section id="view-root" aria-live="polite">
        <p class="loading">Loading offline review data…</p>
      </section>
    </main>
  </div>

  <div id="drawer" class="drawer" hidden aria-hidden="true">
    <div class="drawer-inner" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title">Detail</h2>
        <button type="button" id="drawer-close" class="btn">Close</button>
      </div>
      <div id="drawer-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden aria-live="assertive"></div>

  <script src="/dashboard.js"></script>
</body>
</html>
